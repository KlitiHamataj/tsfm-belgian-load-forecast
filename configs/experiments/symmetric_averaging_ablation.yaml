name: symmetric_averaging_ablation
# Does Timestral's mirrored pass (symmetric_averaging, library default = on) buy accuracy for its ~2x CPU cost?
models:
  - timestral-123m          # default (on); 60d cells shared with the leaderboard
  - timestral-209m          # default (on); 60d cells shared with the leaderboard
  - group: ablations        # timestral-123m-nosym, timestral-209m-nosym (off)
  - elia_reference          # reference for paired comparisons
covariate_sets: [none, full]
contexts_days: [60]
context_policy: truncate
device: cpu
num_threads: null
seed: 42
conclusion: >-
  symmetric_averaging off: ~2x faster on CPU, no measurable accuracy loss (209M: small, probable gain; 123M: no effect).
