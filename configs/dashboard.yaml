# Series exported by `bench export-dashboard` to docs/dashboard/ (data.json, daily.json).
# Each entry is one run cell under outputs/runs/<model>/<covariates>/ctxNNd (baselines: covariates "default", no
# context). Colours come from the model cards. Labels default to "<card display_name> (<N> days)" plus " †" when the
# card's contamination flag applies; `label` overrides that, `short` is used on narrow screens, `dash` draws the
# series as a dashed line (page and images).
series:
  - {model: timestral-123m, covariates: full, context_days: 75, short: Timestral 123M, default: true}
  - {model: t0-gamma, covariates: full, context_days: 75, short: t0-gamma}
  - {model: chronos-2, covariates: full, context_days: 60, short: Chronos-2}
  - {model: elia_reference, covariates: default, label: Elia operational forecast (reference), short: Elia, default: true, dash: true}
quantiles: [P10, P50, P90]
# Default view = the Monday-Sunday week of the scored year with no public holiday whose WAPE is closest to the
# full-year WAPE, summed over the `default: true` series (minimum sum of absolute differences).
check_against: results/leaderboard/results_wide.csv        # full-year WAPE must match to `tolerance_pp`
tolerance_pp: 0.01
out_dir: docs/dashboard
