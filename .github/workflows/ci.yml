name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Unit tests must not touch the network: no model downloads, no data downloads.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Ruff
        run: uv run ruff check src tests scripts
      - name: Pytest (offline; data-backed tests skip without data/processed)
        run: uv run pytest -q -rs
